<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <th:block th:fragment="trail(sectionLabel, sectionHref, parentLabel, parentHref, currentLabel, backHref, backLabel, subtitle)">
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body d-flex justify-content-between align-items-start gap-3 flex-wrap">
        <div>
          <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-2">
              <li class="breadcrumb-item"><a th:href="@{/home}">Inicio</a></li>

              <li class="breadcrumb-item" th:if="${sectionLabel != null and !#strings.isEmpty(sectionLabel)}">
                <a th:if="${sectionHref != null}" th:href="${sectionHref}" th:text="${sectionLabel}">Sección</a>
                <span th:if="${sectionHref == null}" th:text="${sectionLabel}">Sección</span>
              </li>

              <li class="breadcrumb-item" th:if="${parentLabel != null and !#strings.isEmpty(parentLabel)}">
                <a th:if="${parentHref != null}" th:href="${parentHref}" th:text="${parentLabel}">Padre</a>
                <span th:if="${parentHref == null}" th:text="${parentLabel}">Padre</span>
              </li>

              <li class="breadcrumb-item active" aria-current="page" th:text="${currentLabel}">Actual</li>
            </ol>
          </nav>

          <h2 class="h5 mb-1" th:text="${currentLabel}">Actual</h2>
          <p class="text-muted mb-0" th:if="${subtitle != null and !#strings.isEmpty(subtitle)}" th:text="${subtitle}">Subtítulo</p>
        </div>

        <div th:if="${backHref != null and backLabel != null and !#strings.isEmpty(backLabel)}">
          <a class="btn btn-outline-secondary btn-sm" th:href="${backHref}">
            <i class="bi bi-arrow-left me-1"></i>
            <span th:text="${backLabel}">Volver</span>
          </a>
        </div>
      </div>
    </div>
  </th:block>
</body>
</html>
