<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${businessShortName != null ? businessShortName + ' - Nueva contraseña' : 'Eco Agua - Nueva contraseña'}">Nueva contraseña</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body th:style="|--login-primary-color: ${loginPrimaryColor}; --login-primary-hover: ${loginPrimaryHoverColor};|">

<div class="login-bg" th:style="'background-image: url(' + @{${loginBackgroundImage}} + ');'"></div>
<div class="login-overlay"></div>

<main class="login-page-shell">
    <section class="login-card login-card-wide">
        <div class="login-logo-circle">
            <img th:src="@{${loginLogo}}"
                 th:alt="${businessName} ?: 'Eco Agua'"
                 alt="Eco Agua">
        </div>

        <h1 class="login-title" th:text="${passwordResetFormTitle}">Crear nueva contraseña</h1>
        <p class="login-subtitle">Ingresa una nueva contraseña para recuperar el acceso.</p>

        <div th:if="${resetInvalid}" class="alert alert-danger py-2 mb-3 small">
            El enlace de recuperación expiró, ya fue utilizado o no es válido.
        </div>
        <div th:if="${resetError}" class="alert alert-danger py-2 mb-3 small" th:text="${resetError}">
            No se pudo actualizar la contraseña.
        </div>

        <form th:if="${!resetInvalid}" th:action="@{/password-reset}" method="post" autocomplete="off">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="token" th:value="${token}">

            <div class="mb-3">
                <label for="password" class="form-label">Nueva contraseña</label>
                <input id="password" name="password" type="password" class="form-control"
                       placeholder="Mínimo 6 caracteres" minlength="6" required autofocus>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                <input id="confirmPassword" name="confirmPassword" type="password" class="form-control"
                       placeholder="Repite la nueva contraseña" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-login" th:text="${passwordResetSaveLabel}">
                Guardar nueva contraseña
            </button>
        </form>

        <div class="login-footer-links mt-3">
            <a th:href="@{/password-reset/request}">Solicitar un nuevo enlace</a>
            <span>·</span>
            <a th:href="@{/login}">Volver al acceso</a>
        </div>
    </section>
</main>

</body>
</html>
