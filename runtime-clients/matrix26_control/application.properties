# Matrix26 Control Center - dedicated runtime
# This runtime uses its own database and does not read operational business tables.

server.port=8091
spring.datasource.url=jdbc:mysql://localhost:3306/matrix26_platform_control?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${MATRIX26_DB_USERNAME:root}
spring.datasource.password=${MATRIX26_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The control schema is created idempotently by Matrix26ControlCenterInitializer.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=always

matrix26.control-center.enabled=true
matrix26.control-center.read-only=false
matrix26.control-center.display-name=Matrix26 Control Center
matrix26.control-center.runtime-profile=matrix26_control
matrix26.control-center.database-name=matrix26_platform_control
matrix26.control-center.portal-url=http://localhost:8091
matrix26.control-center.bootstrap-admin-username=${MATRIX26_ADMIN_USERNAME:matrix_admin}
matrix26.control-center.bootstrap-admin-password=${MATRIX26_ADMIN_PASSWORD:Matrix26Demo123!}
matrix26.control-center.health-cache-seconds=30

# Neutral platform branding used by shared authentication components.
ecoagua.business.profile-code=matrix26_control
ecoagua.business.name=Matrix26 Control Center
ecoagua.business.short-name=Matrix26
ecoagua.business.tagline=Administración central de instancias empresariales
ecoagua.business.type=platform_control
ecoagua.business.admin-title=Control Center
ecoagua.business.logo=/img/matrix26-mark.svg
ecoagua.business.admin-logo=/img/matrix26-mark.svg
ecoagua.business.whatsapp-number=
ecoagua.business.location=Iquitos
ecoagua.business.phone=
ecoagua.business.footer-right=Matrix26 Business Platform
ecoagua.business.topbar-whatsapp-label=
ecoagua.business.featured-category-name=
ecoagua.business.catalog-whatsapp-intro=

# Business modules remain disabled in the dedicated control runtime.
ecoagua.features.containers=false
ecoagua.features.delivery=false
ecoagua.features.production=false
ecoagua.features.reorder=false
ecoagua.features.marketing=false
ecoagua.features.blog=false
ecoagua.features.academy=false
ecoagua.features.restaurant=false
ecoagua.features.testimonials=false
ecoagua.features.public-catalog=false
ecoagua.features.supplies=false
ecoagua.features.fixed-costs=false
ecoagua.features.break-even=false
ecoagua.features.price-simulator=false

google.maps.api-key=

# Phase 3B real provisioning is available only from the dedicated control runtime.
matrix26.control-center.provisioning-execution-enabled=true
matrix26.control-center.provisioning-template-database=restaurante_buen_sabor
matrix26.control-center.provisioning-runtime-directory=runtime-clients

# Appearance Studio Phase 3C.3 publishes only to the explicit laboratory instance.
matrix26.control-center.appearance-publishing-enabled=true
matrix26.control-center.appearance-publish-allowed-instance-codes=matrix26-restaurant-lab

matrix26.control-center.appearance-data-directory=runtime-data

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=12MB

# Matrix26 Backups Phase 3E.2
matrix26.control-center.backups.dump-executable=${MATRIX26_MYSQLDUMP_PATH:C:/wamp64/bin/mariadb/mariadb10.10.2/bin/mariadb-dump.exe}
matrix26.control-center.backups.root-directory=${MATRIX26_BACKUP_ROOT:C:/Users/PC/Matrix26/backups}
matrix26.control-center.backups.runtime-directory=runtime-clients
matrix26.control-center.backups.runtime-data-directory=runtime-data
matrix26.control-center.backups.maximum-single-file-bytes=536870912
matrix26.control-center.backups.maximum-archive-source-bytes=2147483648
matrix26.control-center.backups.diagnostic-log-tail-lines=400

# Matrix26 Backups Phase 3E.3
matrix26.control-center.backups.encryption-enabled=true
matrix26.control-center.backups.master-key-environment=MATRIX26_BACKUP_MASTER_KEY
matrix26.control-center.backups.retention-enabled=true

# Matrix26 Backups Phase 3E.4
matrix26.control-center.backups.scheduling-enabled=true
matrix26.control-center.backups.scheduler-poll-milliseconds=60000
matrix26.control-center.backups.scheduler-initial-delay-milliseconds=15000
matrix26.control-center.backups.scheduler-grace-minutes=2
matrix26.control-center.backups.schedule-timezone=America/Lima

# Matrix26 Restore Manager Phase 3F.1
matrix26.control-center.restores.enabled=true
matrix26.control-center.restores.allowed-source-instance-codes=matrix26-appearance-lab
matrix26.control-center.restores.target-instance-code=matrix26-restore-test
matrix26.control-center.restores.target-instance-name=Matrix26 Restore Test
matrix26.control-center.restores.target-database-name=matrix26_restore_test
matrix26.control-center.restores.target-runtime-profile=matrix26_restore_test
matrix26.control-center.restores.target-runtime-port=8095
matrix26.control-center.restores.target-public-url=http://localhost:8095
matrix26.control-center.restores.runtime-directory=runtime-clients
matrix26.control-center.restores.runtime-data-directory=runtime-data
matrix26.control-center.restores.import-executable=${MATRIX26_MYSQL_PATH:C:/wamp64/bin/mariadb/mariadb10.10.2/bin/mariadb.exe}
matrix26.control-center.restores.process-timeout-seconds=1200
matrix26.control-center.restores.start-after-restore-default=true

# Matrix26 Restore Manager Phase 3F.2
matrix26.control-center.restores.verification-enabled=true
matrix26.control-center.restores.resume-enabled=true
matrix26.control-center.restores.verification-http-timeout-seconds=10
matrix26.control-center.restores.verification-http-paths=/,/login,/restaurant/menu,/admin/restaurant/dashboard

# Matrix26 Restore Manager Phase 3F.3
matrix26.control-center.restores.cleanup-enabled=true

matrix26.control-center.enabled=true
matrix26.control-center.backups.scheduling-enabled=true

# Matrix26 Lifecycle Manager Phase 3G.1
matrix26.control-center.lifecycle.enabled=true
matrix26.control-center.lifecycle.allowed-instance-codes=matrix26-appearance-lab
matrix26.control-center.lifecycle.maximum-verified-backup-age-hours=72
matrix26.control-center.lifecycle.minimum-reason-length=10

# Matrix26 Lifecycle Manager Phase 3G.2
matrix26.control-center.lifecycle.decommission.enabled=true
matrix26.control-center.lifecycle.decommission.allowed-instance-codes=matrix26-appearance-lab
matrix26.control-center.lifecycle.decommission.minimum-reason-length=10
matrix26.control-center.lifecycle.decommission.default-retention-days=30
matrix26.control-center.lifecycle.decommission.minimum-retention-days=1
matrix26.control-center.lifecycle.decommission.maximum-retention-days=3650
