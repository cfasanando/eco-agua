# Matrix26 Control Center - dedicated runtime
# This runtime uses its own database and does not read operational business tables.

server.port=8091
spring.datasource.url=jdbc:mysql://localhost:3306/matrix26_platform_control?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
spring.datasource.username=${MATRIX26_DB_USERNAME:root}
spring.datasource.password=${MATRIX26_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# The control schema is created idempotently by Matrix26ControlCenterInitializer.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=always

matrix26.control-center.enabled=true
matrix26.control-center.read-only=true
matrix26.control-center.display-name=Matrix26 Control Center
matrix26.control-center.runtime-profile=matrix26_control
matrix26.control-center.database-name=matrix26_platform_control
matrix26.control-center.portal-url=http://localhost:8091
matrix26.control-center.bootstrap-admin-username=${MATRIX26_ADMIN_USERNAME:matrix_admin}
matrix26.control-center.bootstrap-admin-password=${MATRIX26_ADMIN_PASSWORD:Matrix26Demo123!}
matrix26.control-center.health-cache-seconds=30

# Neutral platform branding used by shared authentication components.
ecoagua.business.profile-code=matrix26_control
ecoagua.business.name=Matrix26 Control Center
ecoagua.business.short-name=Matrix26
ecoagua.business.tagline=Administración central de instancias empresariales
ecoagua.business.type=platform_control
ecoagua.business.admin-title=Control Center
ecoagua.business.logo=/img/matrix26-mark.svg
ecoagua.business.admin-logo=/img/matrix26-mark.svg
ecoagua.business.whatsapp-number=
ecoagua.business.location=Iquitos
ecoagua.business.phone=
ecoagua.business.footer-right=Matrix26 Business Platform
ecoagua.business.topbar-whatsapp-label=
ecoagua.business.featured-category-name=
ecoagua.business.catalog-whatsapp-intro=

# Business modules remain disabled in the dedicated control runtime.
ecoagua.features.containers=false
ecoagua.features.delivery=false
ecoagua.features.production=false
ecoagua.features.reorder=false
ecoagua.features.marketing=false
ecoagua.features.blog=false
ecoagua.features.academy=false
ecoagua.features.restaurant=false
ecoagua.features.testimonials=false
ecoagua.features.public-catalog=false
ecoagua.features.supplies=false
ecoagua.features.fixed-costs=false
ecoagua.features.break-even=false
ecoagua.features.price-simulator=false

google.maps.api-key=
