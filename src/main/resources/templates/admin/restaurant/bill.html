<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuenta de mesa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8fafc; color: #111827; }
        .print-shell { max-width: 560px; margin: 24px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
        .print-actions { max-width: 560px; margin: 16px auto 0; }
        .line-row { border-top: 1px dashed #cbd5e1; padding: 10px 0; }
        @media print {
            body { background: #fff; }
            .print-shell { margin: 0; max-width: none; border: none; border-radius: 0; padding: 0; }
            .print-actions { display: none !important; }
        }
    </style>
</head>
<body>
<div class="print-actions d-flex gap-2 justify-content-end">
    <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir cuenta</button>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/restaurant/orders/{id}(id=${order.id()})}">Volver a comanda</a>
</div>

<main class="print-shell shadow-sm">
    <header class="text-center mb-4">
        <img th:if="${platformLogo != null and !platformLogo.isBlank()}" th:src="@{${platformLogo}}" alt="Logo" style="max-height:56px;" class="mb-2">
        <h1 class="h4 mb-1" th:text="${businessName}">Restaurante</h1>
        <p class="text-muted small mb-0" th:text="${businessTagline}">Cuenta de mesa</p>
    </header>

    <div class="d-flex justify-content-between align-items-start border-top border-bottom py-3 mb-3">
        <div>
            <div class="small text-muted">Cuenta</div>
            <strong th:text="${order.orderCode()}">CMD-0001</strong>
            <div class="small text-muted" th:text="${order.serviceReference()}">Mesa</div>
        </div>
        <div class="text-end">
            <span class="badge" th:classappend="${order.statusBadge()}" th:text="${order.statusLabel()}">Estado</span>
            <div class="small text-muted mt-2" th:text="${#temporals.format(generatedAt, 'dd/MM/yyyy HH:mm')}">fecha</div>
        </div>
    </div>

    <section class="mb-3">
        <div class="line-row" th:each="item : ${items}">
            <div class="d-flex justify-content-between gap-3">
                <div>
                    <strong><span th:text="${item.quantity()}">1</span> x <span th:text="${item.productName()}">Producto</span></strong>
                    <div class="small text-muted">S/ <span th:text="${#numbers.formatDecimal(item.unitPrice(),1,2)}">0.00</span> c/u</div>
                </div>
                <strong>S/ <span th:text="${#numbers.formatDecimal(item.lineTotal(),1,2)}">0.00</span></strong>
            </div>
        </div>
        <div th:if="${items.isEmpty()}" class="text-muted text-center py-4">Sin productos.</div>
    </section>

    <div class="border-top pt-3">
        <div class="d-flex justify-content-between align-items-center fs-4">
            <span>Total</span>
            <strong>S/ <span th:text="${#numbers.formatDecimal(order.safeSubtotal(),1,2)}">0.00</span></strong>
        </div>
    </div>

    <p class="text-center text-muted small mt-4 mb-0">Gracias por su visita.</p>
</main>
</body>
</html>
