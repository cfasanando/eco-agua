<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head_admin :: adminHead('Cocina')"></head>
<body class="bg-light">
<div class="d-flex" id="wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div id="page-content-wrapper" class="flex-grow-1 d-flex flex-column min-vh-100">
        <div th:replace="fragments/topbar :: topbar"></div>
        <main class="container-fluid mt-4 flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
                <div><h1 class="h4 mb-1">Pantalla de cocina</h1><p class="text-muted small mb-0">Comandas pendientes y listas para servir.</p></div>
                <a th:href="@{/admin/restaurant/orders/new}" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> Nueva comanda</a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><span th:text="${successMessage}">OK</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

            <div class="row g-3">
                <div class="col-lg-6 col-xl-4" th:each="order : ${orders}">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="card-header bg-white d-flex justify-content-between align-items-start gap-2">
                            <div>
                                <a th:href="@{/admin/restaurant/orders/{id}(id=${order.id()})}" class="fw-semibold text-decoration-none" th:text="${order.orderCode()}">CMD</a>
                                <div class="small text-muted">
                                    <span th:text="${order.serviceLabel()}">Mesa</span>
                                    <span th:if="${order.tableName() != null}"> · <span th:text="${order.tableName()}">Mesa 1</span></span>
                                </div>
                            </div>
                            <span class="badge" th:classappend="${order.statusBadge()}" th:text="${order.statusLabel()}">Estado</span>
                        </div>
                        <div class="card-body">
                            <ul class="list-group list-group-flush mb-3">
                                <li class="list-group-item px-0 d-flex justify-content-between" th:each="item : ${itemsByOrder.get(order.id())}">
                                    <span><strong th:text="${item.quantity()}">1</strong> x <span th:text="${item.productName()}">Producto</span></span>
                                    <span>S/ <span th:text="${#numbers.formatDecimal(item.lineTotal(),1,2)}">0.00</span></span>
                                </li>
                            </ul>
                            <p class="small text-muted" th:if="${order.notes() != null}" th:text="${order.notes()}">Nota</p>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="small text-muted" th:text="${#temporals.format(order.createdAt(), 'dd/MM HH:mm')}">fecha</span>
                                <strong>S/ <span th:text="${#numbers.formatDecimal(order.subtotal(),1,2)}">0.00</span></strong>
                            </div>
                            <div class="d-flex gap-2 flex-wrap">
                                <form th:action="@{/admin/restaurant/orders/{id}/status(id=${order.id()})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="status" value="IN_KITCHEN"/>
                                    <button class="btn btn-sm btn-outline-warning">En cocina</button>
                                </form>
                                <form th:action="@{/admin/restaurant/orders/{id}/status(id=${order.id()})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="status" value="READY"/>
                                    <button class="btn btn-sm btn-outline-info">Lista</button>
                                </form>
                                <form th:action="@{/admin/restaurant/orders/{id}/status(id=${order.id()})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="status" value="SERVED"/>
                                    <button class="btn btn-sm btn-outline-primary">Servida</button>
                                </form>
                                <a th:href="@{/admin/restaurant/orders/{id}(id=${order.id()})}" class="btn btn-sm btn-outline-secondary">Detalle</a>
                                <form th:action="@{/admin/restaurant/orders/{id}/pay(id=${order.id()})}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <input type="hidden" name="paymentMethod" value="CASH"/>
                                    <button class="btn btn-sm btn-success">Cobrar</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12" th:if="${orders.isEmpty()}"><div class="alert alert-info">No hay comandas pendientes en cocina.</div></div>
            </div>
        </main>
    </div>
</div>
<div th:replace="fragments/scripts_admin :: adminScripts"></div>
</body>
</html>
