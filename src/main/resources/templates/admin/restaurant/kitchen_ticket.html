<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ticket cocina</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8fafc; color: #111827; }
        .ticket-shell { max-width: 420px; margin: 24px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; }
        .ticket-title { font-size: 1.4rem; font-weight: 800; letter-spacing: .03em; text-transform: uppercase; }
        .ticket-code { font-size: 1.8rem; font-weight: 900; }
        .ticket-item { border-top: 1px dashed #cbd5e1; padding: 10px 0; }
        .qty { font-size: 1.35rem; font-weight: 900; }
        .print-actions { max-width: 420px; margin: 16px auto 0; }
        @media print {
            body { background: #fff; }
            .ticket-shell { margin: 0; max-width: none; border: none; border-radius: 0; box-shadow: none; padding: 0; }
            .print-actions { display: none !important; }
        }
    </style>
</head>
<body>
<div class="print-actions d-flex gap-2 justify-content-end">
    <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/restaurant/kitchen}">Volver a cocina</a>
</div>

<main class="ticket-shell shadow-sm">
    <div class="text-center mb-3">
        <div class="ticket-title">Ticket de cocina</div>
        <div class="small text-muted" th:text="${businessName}">Restaurante</div>
    </div>

    <div class="d-flex justify-content-between align-items-start mb-3">
        <div>
            <div class="small text-muted">Comanda</div>
            <div class="ticket-code" th:text="${order.orderCode()}">CMD-0001</div>
        </div>
        <div class="text-end">
            <span class="badge text-bg-warning" th:text="${order.statusLabel()}">Estado</span>
            <div class="small text-muted mt-2" th:text="${#temporals.format(generatedAt, 'dd/MM HH:mm')}">fecha</div>
        </div>
    </div>

    <div class="border rounded-3 p-3 mb-3 bg-light">
        <div class="d-flex justify-content-between"><span class="text-muted">Referencia</span><strong th:text="${order.serviceReference()}">Mesa</strong></div>
        <div class="d-flex justify-content-between"><span class="text-muted">Servicio</span><strong th:text="${order.serviceLabel()}">Salón</strong></div>
        <div class="d-flex justify-content-between"><span class="text-muted">Creada</span><strong th:text="${#temporals.format(order.createdAt(), 'dd/MM HH:mm')}">fecha</strong></div>
    </div>

    <div th:if="${externalOrder != null}" class="border rounded-3 p-3 mb-3 bg-light small">
        <div class="d-flex justify-content-between"><span class="text-muted">Cliente</span><strong th:text="${externalOrder.customerName()}">Cliente</strong></div>
        <div class="d-flex justify-content-between"><span class="text-muted">Teléfono</span><strong th:text="${externalOrder.customerPhone()}">Teléfono</strong></div>
        <div class="d-flex justify-content-between"><span class="text-muted">Hora estimada</span><strong th:text="${externalOrder.scheduledAt() == null ? 'Lo antes posible' : #temporals.format(externalOrder.scheduledAt(), 'dd/MM HH:mm')}">Hora</strong></div>
        <div th:if="${externalOrder.isDelivery()}" class="mt-2">
            <div class="text-muted">Dirección</div>
            <div class="fw-semibold" th:text="${externalOrder.deliveryAddress()}">Dirección</div>
            <div th:if="${externalOrder.deliveryReference() != null}" class="text-muted" th:text="${externalOrder.deliveryReference()}">Referencia</div>
        </div>
    </div>

    <section>
        <div class="ticket-item" th:each="item : ${items}">
            <div class="d-flex gap-3 align-items-start">
                <div class="qty" th:text="${item.quantity()} + 'x'">1x</div>
                <div class="flex-grow-1">
                    <div class="fw-bold fs-5" th:text="${item.productName()}">Producto</div>
                    <div class="small text-muted" th:text="${item.kitchenStatusLabel()}">Pendiente</div>
                </div>
            </div>
        </div>
        <div th:if="${items.isEmpty()}" class="text-muted text-center py-4">Sin productos.</div>
    </section>

    <div class="alert alert-warning mt-3 mb-0" th:if="${order.notes() != null and !order.notes().isBlank()}">
        <strong>Nota:</strong> <span th:text="${order.notes()}">Sin cebolla</span>
    </div>
</main>
</body>
</html>
