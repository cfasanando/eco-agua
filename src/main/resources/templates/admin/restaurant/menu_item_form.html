<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head_admin :: adminHead(${formTitle})}"></head>
<body class="bg-light">
<div class="d-flex" id="wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div id="page-content-wrapper" class="flex-grow-1 d-flex flex-column min-vh-100">
        <div th:replace="fragments/topbar :: topbar"></div>
        <main class="container-fluid mt-4 flex-grow-1">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <div>
                    <h1 class="h4 mb-1" th:text="${formTitle}">Nuevo plato</h1>
                    <p class="text-muted small mb-0">Configura el plato que se verá en la carta QR y en las comandas.</p>
                </div>
                <a th:href="@{/admin/restaurant/menu-items}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Volver a platos
                </a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="${formAction}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="col-lg-8">
                    <div class="card shadow-sm border-0 mb-3">
                        <div class="card-header bg-white"><strong>Información del plato</strong></div>
                        <div class="card-body">
                            <label class="form-label">Nombre del plato</label>
                            <input name="name" class="form-control mb-3" required maxlength="200"
                                   th:value="${item != null ? item.name() : ''}"
                                   placeholder="Ejemplo: Tacacho con cecina">

                            <label class="form-label">Descripción corta</label>
                            <textarea name="description" class="form-control mb-3" rows="3"
                                      placeholder="Descripción para la carta pública"
                                      th:text="${item != null ? item.description() : ''}"></textarea>

                            <label class="form-label">Imagen</label>
                            <input name="imagePath" class="form-control mb-3"
                                   th:value="${item != null ? item.imagePath() : ''}"
                                   placeholder="/img/product-default.svg o /uploads/platos/tacacho.jpg">

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Categoría existente</label>
                                    <select name="categoryId" class="form-select">
                                        <option value="">Carta general</option>
                                        <option th:each="category : ${categories}"
                                                th:value="${category.id()}"
                                                th:selected="${item != null and item.categoryId() != null and item.categoryId().equals(category.id())}"
                                                th:text="${category.name()}">Categoría</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Nueva categoría opcional</label>
                                    <input name="newCategoryName" class="form-control" placeholder="Entradas, Fondos, Bebidas, Postres">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card shadow-sm border-0 mb-3">
                        <div class="card-header bg-white"><strong>Precio y disponibilidad</strong></div>
                        <div class="card-body">
                            <label class="form-label">Precio de venta</label>
                            <input name="price" type="number" step="0.01" min="0" class="form-control mb-3" required
                                   th:value="${item != null ? item.priceDisplay() : '0.00'}">

                            <label class="form-label">Stock referencial</label>
                            <input name="stock" type="number" step="0.01" min="0" class="form-control mb-3"
                                   th:value="${item != null ? item.stockDisplay() : '0'}">

                            <label class="form-label">Stock mínimo</label>
                            <input name="minimumStock" type="number" step="0.01" min="0" class="form-control mb-3"
                                   th:value="${item != null ? item.minimumStockDisplay() : '0'}">

                            <label class="form-label">Orden en carta</label>
                            <input name="sortOrder" type="number" min="0" class="form-control mb-3"
                                   th:value="${item != null ? item.restaurantSortOrder() : 0}">

                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="active" name="active"
                                       th:checked="${item == null or item.active()}">
                                <label class="form-check-label" for="active">Activo interno</label>
                            </div>
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="restaurantVisible" name="restaurantVisible"
                                       th:checked="${item == null or item.restaurantVisible()}">
                                <label class="form-check-label" for="restaurantVisible">Visible en carta QR</label>
                            </div>
                            <div class="form-check form-switch mb-2">
                                <input class="form-check-input" type="checkbox" id="restaurantAvailable" name="restaurantAvailable"
                                       th:checked="${item == null or item.restaurantAvailable()}">
                                <label class="form-check-label" for="restaurantAvailable">Disponible para vender</label>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="featured" name="featured"
                                       th:checked="${item != null and item.featured()}">
                                <label class="form-check-label" for="featured">Destacado en carta</label>
                            </div>

                            <button class="btn btn-primary w-100">
                                <i class="bi bi-save"></i> Guardar plato
                            </button>
                            <a th:if="${item != null}" th:href="@{/admin/restaurant/menu-items/{id}/recipe(id=${item.id()})}"
                               class="btn btn-outline-dark w-100 mt-2">
                                <i class="bi bi-journal-text"></i> Editar receta y costos
                            </a>
                        </div>
                    </div>

                    <div class="alert alert-light border small">
                        <strong>Nota:</strong> un plato agotado u oculto no aparece en la carta pública ni en la creación de comandas.
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="fragments/scripts_admin :: adminScripts"></div>
</body>
</html>
