<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/head_admin :: adminHead('Nueva comanda')"></head>
<body class="bg-light">
<div class="d-flex" id="wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div id="page-content-wrapper" class="flex-grow-1 d-flex flex-column min-vh-100">
        <div th:replace="fragments/topbar :: topbar"></div>
        <main class="container-fluid mt-4 flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
                <div><h1 class="h4 mb-1">Nueva comanda</h1><p class="text-muted small mb-0">Registra pedidos de salón, recojo o delivery.</p></div>
                <a sec:authorize="hasAnyAuthority('ADMIN_PRINC','ADMIN','SUPERVISOR','ROLE_OWNER','ROLE_MANAGEMENT','ROLE_RESTAURANT_WAITER','ROLE_RESTAURANT_KITCHEN','ver_restaurante','administra_restaurante','restaurante_mozo','restaurante_cocina')" th:href="@{/admin/restaurant/kitchen}" class="btn btn-sm btn-outline-danger"><i class="bi bi-fire"></i> Cocina</a>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show"><span th:text="${errorMessage}">Error</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>

            <form th:action="@{/admin/restaurant/orders}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3">
                    <div class="col-lg-4">
                        <div class="card shadow-sm mb-3">
                            <div class="card-header bg-white"><strong>Datos de atención</strong></div>
                            <div class="card-body">
                                <label class="form-label">Tipo de servicio</label>
                                <select name="serviceType" class="form-select mb-3">
                                    <option value="DINE_IN">Mesa / salón</option>
                                    <option value="TAKEAWAY">Para llevar</option>
                                    <option value="DELIVERY">Delivery</option>
                                </select>

                                <label class="form-label">Mesa</label>
                                <select name="tableId" class="form-select mb-3">
                                    <option value="">Sin mesa</option>
                                    <option th:each="table : ${tables}"
                                            th:value="${table.id()}"
                                            th:selected="${selectedTableId != null and table.id().equals(selectedTableId)}"
                                            th:text="|${table.name()} - ${table.statusLabel()}|">Mesa</option>
                                </select>

                                <label class="form-label">Cliente / referencia</label>
                                <input name="customerName" class="form-control mb-3" placeholder="Cliente, oficina, habitación, etc.">

                                <label class="form-label">Teléfono</label>
                                <input name="customerPhone" class="form-control mb-3" placeholder="WhatsApp">

                                <label class="form-label">Observaciones</label>
                                <textarea name="notes" class="form-control" rows="3" placeholder="Sin ají, llevar cubiertos, etc."></textarea>
                            </div>
                        </div>
                        <div class="alert alert-light border d-flex justify-content-between align-items-center">
                            <span class="text-muted">Total estimado</span>
                            <strong>S/ <span id="order-total">0.00</span></strong>
                        </div>
                        <button class="btn btn-primary w-100 btn-lg"><i class="bi bi-send-check"></i> Enviar a cocina</button>
                    </div>

                    <div class="col-lg-8">
                        <div class="card shadow-sm">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                                <strong>Carta rápida</strong>
                                <span class="badge text-bg-secondary" th:text="${menuItems.size()} + ' productos'">0 productos</span>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-6" th:each="item : ${menuItems}">
                                        <div class="border rounded-3 p-3 h-100 bg-white">
                                            <div class="d-flex gap-3">
                                                <img th:src="@{${item.imageOrFallback()}}" class="rounded-3 flex-shrink-0" style="width:72px;height:72px;object-fit:cover;" alt="Producto">
                                                <div class="flex-grow-1">
                                                    <div class="fw-semibold" th:text="${item.name()}">Producto</div>
                                                    <div class="small text-muted mb-2" th:text="${item.description()}">Descripción</div>
                                                    <div class="d-flex justify-content-between align-items-center gap-2">
                                                        <strong>S/ <span th:text="${#numbers.formatDecimal(item.price(),1,2)}">0.00</span></strong>
                                                        <input type="number" min="0" max="99" value="0" class="form-control form-control-sm text-center js-qty" style="max-width:90px;" th:name="${'qty_' + item.id()}" th:attr="data-price=${item.price()}" aria-label="Cantidad">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-12" th:if="${menuItems.isEmpty()}"><div class="alert alert-info mb-0">No hay productos activos para crear comandas.</div></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </main>
    </div>
</div>
<div th:replace="fragments/scripts_admin :: adminScripts"></div>
<script>
    document.querySelectorAll('.js-qty').forEach((input) => {
        input.addEventListener('input', () => {
            let total = 0;
            document.querySelectorAll('.js-qty').forEach((qtyInput) => {
                const qty = Number(qtyInput.value || 0);
                const price = Number(qtyInput.dataset.price || 0);
                total += qty * price;
            });
            const target = document.getElementById('order-total');
            if (target) {
                target.textContent = total.toFixed(2);
            }
        });
    });
</script>
</body>
</html>
