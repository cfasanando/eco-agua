<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recibo simple</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f8fafc; color: #111827; }
        .receipt-shell { max-width: 420px; margin: 24px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; }
        .print-actions { max-width: 420px; margin: 16px auto 0; }
        .line-row { border-top: 1px dashed #cbd5e1; padding: 9px 0; }
        @media print {
            body { background: #fff; }
            .receipt-shell { margin: 0; max-width: none; border: none; border-radius: 0; padding: 0; }
            .print-actions { display: none !important; }
        }
    </style>
</head>
<body>
<div class="print-actions d-flex gap-2 justify-content-end">
    <button class="btn btn-primary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir recibo</button>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/restaurant/cash}">Volver a caja</a>
    <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/restaurant/orders/{id}(id=${order.id()})}">Ver comanda</a>
</div>

<main class="receipt-shell shadow-sm">
    <header class="text-center mb-3">
        <img th:if="${platformLogo != null and !platformLogo.isBlank()}" th:src="@{${platformLogo}}" alt="Logo" style="max-height:52px;" class="mb-2">
        <h1 class="h5 mb-1" th:text="${businessName}">Restaurante</h1>
        <p class="text-muted small mb-0">Recibo simple</p>
    </header>

    <div class="border-top border-bottom py-3 mb-3 small">
        <div class="d-flex justify-content-between"><span class="text-muted">Comanda</span><strong th:text="${order.orderCode()}">CMD</strong></div>
        <div class="d-flex justify-content-between"><span class="text-muted">Referencia</span><strong th:text="${order.serviceReference()}">Mesa</strong></div>
        <div class="d-flex justify-content-between"><span class="text-muted">Pago</span><strong th:text="${paidOrder == null ? '-' : paidOrder.paymentLabel()}">Efectivo</strong></div>
        <div class="d-flex justify-content-between"><span class="text-muted">Cobrado</span><strong th:text="${paidOrder == null or paidOrder.paidAt() == null ? #temporals.format(generatedAt, 'dd/MM/yyyy HH:mm') : #temporals.format(paidOrder.paidAt(), 'dd/MM/yyyy HH:mm')}">fecha</strong></div>
    </div>

    <section>
        <div class="line-row" th:each="item : ${items}">
            <div class="d-flex justify-content-between gap-3">
                <div>
                    <strong><span th:text="${item.quantity()}">1</span> x <span th:text="${item.productName()}">Producto</span></strong>
                    <div class="small text-muted">S/ <span th:text="${#numbers.formatDecimal(item.unitPrice(),1,2)}">0.00</span> c/u</div>
                </div>
                <strong>S/ <span th:text="${#numbers.formatDecimal(item.lineTotal(),1,2)}">0.00</span></strong>
            </div>
        </div>
    </section>

    <div class="border-top pt-3 mt-2">
        <div th:if="${externalOrder != null}" class="d-flex justify-content-between small mb-2">
            <span class="text-muted">Productos</span>
            <strong>S/ <span th:text="${#numbers.formatDecimal(externalOrder.safeSubtotal(),1,2)}">0.00</span></strong>
        </div>
        <div th:if="${externalOrder != null and externalOrder.isDelivery()}" class="d-flex justify-content-between small mb-2">
            <span class="text-muted">Delivery</span>
            <strong>S/ <span th:text="${#numbers.formatDecimal(externalOrder.safeDeliveryFee(),1,2)}">0.00</span></strong>
        </div>
        <div class="d-flex justify-content-between align-items-center fs-4">
            <span>Total</span>
            <strong>S/ <span th:text="${#numbers.formatDecimal(order.safeSubtotal(),1,2)}">0.00</span></strong>
        </div>
    </div>

    <p class="text-center text-muted small mt-4 mb-0">Documento interno de control. No reemplaza comprobante electrónico.</p>
</main>
</body>
</html>
