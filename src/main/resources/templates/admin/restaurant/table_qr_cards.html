<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR de mesas</title>
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css}" />
    <style>
        body { background: #f8f9fa; }
        .qr-card { min-height: 320px; break-inside: avoid; }
        .qr-image { width: 180px; height: 180px; }
        @media print {
            body { background: #fff; }
            .no-print { display: none !important; }
            .qr-card { border: 1px solid #111 !important; box-shadow: none !important; }
        }
    </style>
</head>
<body>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4 no-print">
        <div>
            <h1 class="h4 mb-1">QR de mesas</h1>
            <p class="text-muted small mb-0">Imprime estas tarjetas y colócalas en cada mesa.</p>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/admin/restaurant/tables}" class="btn btn-outline-secondary btn-sm">Volver</a>
            <button type="button" class="btn btn-success btn-sm" onclick="window.print()">
                <i class="bi bi-printer"></i> Imprimir
            </button>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6 col-xl-4" th:each="table : ${tables}">
            <section class="card qr-card shadow-sm border-0 text-center">
                <div class="card-body p-4">
                    <div class="small text-uppercase text-muted mb-1" th:text="${businessName}">Restaurante</div>
                    <h2 class="h4 fw-bold mb-1" th:text="${table.name()}">Mesa 01</h2>
                    <p class="text-muted small mb-3" th:text="|${table.area()} · ${table.seats()} sillas|">Salón</p>
                    <img class="qr-image js-restaurant-qr mb-3"
                         alt="QR de mesa"
                         th:attr="data-public-menu-link=@{/restaurant/menu(tableId=${table.id()})}">
                    <p class="fw-semibold mb-1">Escanea para ver la carta</p>
                    <p class="small text-muted mb-3">Tu mesa quedará identificada para solicitar atención.</p>
                    <input type="text" class="form-control form-control-sm text-center js-restaurant-public-link" readonly
                           th:attr="data-public-menu-link=@{/restaurant/menu(tableId=${table.id()})}">
                </div>
            </section>
        </div>
    </div>
</main>
<script th:src="@{/js/restaurant-public-menu-qr.js}"></script>
</body>
</html>
