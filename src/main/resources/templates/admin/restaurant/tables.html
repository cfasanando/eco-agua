<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head_admin :: adminHead('Mesas y salón')"></head>
<body class="bg-light">
<div class="d-flex" id="wrapper">
    <div th:replace="fragments/sidebar :: sidebar"></div>
    <div id="page-content-wrapper" class="flex-grow-1 d-flex flex-column min-vh-100">
        <div th:replace="fragments/topbar :: topbar"></div>
        <main class="container-fluid mt-4 flex-grow-1">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div><h1 class="h4 mb-1">Mesas y salón</h1><p class="text-muted small mb-0">Cambia estado de mesas para operación de salón.</p></div>
                <a th:href="@{/admin/restaurant/orders/new}" class="btn btn-sm btn-primary"><i class="bi bi-plus-circle"></i> Nueva comanda</a>
            </div>
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show"><span th:text="${successMessage}">OK</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            <div class="row g-3">
                <div class="col-md-6 col-xl-3" th:each="table : ${tables}">
                    <div class="card h-100 shadow-sm border-0">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div><h2 class="h5 mb-1" th:text="${table.name()}">Mesa 1</h2><div class="small text-muted" th:text="|${table.area()} · ${table.seats()} sillas|">Área</div></div>
                                <span class="badge" th:classappend="${table.statusBadge()}" th:text="${table.statusLabel()}">Libre</span>
                            </div>
                            <p class="small text-muted" th:text="${table.notes() ?: 'Sin observaciones'}">Nota</p>
                            <form th:action="@{/admin/restaurant/tables/{id}/status(id=${table.id()})}" method="post" class="d-grid gap-2">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <select name="status" class="form-select form-select-sm">
                                    <option value="FREE" th:selected="${table.status() == 'FREE'}">Libre</option>
                                    <option value="OCCUPIED" th:selected="${table.status() == 'OCCUPIED'}">Ocupada</option>
                                    <option value="RESERVED" th:selected="${table.status() == 'RESERVED'}">Reservada</option>
                                    <option value="DISABLED" th:selected="${table.status() == 'DISABLED'}">Fuera de servicio</option>
                                </select>
                                <button class="btn btn-sm btn-outline-primary"><i class="bi bi-save"></i> Guardar estado</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-12" th:if="${tables.isEmpty()}"><div class="alert alert-info">No hay mesas registradas. Ejecuta el SQL demo de restaurante.</div></div>
            </div>
        </main>
    </div>
</div>
<div th:replace="fragments/scripts_admin :: scripts"></div>
</body>
</html>
