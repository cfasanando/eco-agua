<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{control_center/fragments/head :: head('Themes')}"></head>
<body class="matrix26-body" data-theme="matrix26-classic" data-admin-layout="admin-sidebar-classic">
<div class="matrix26-shell">
    <aside th:replace="~{control_center/fragments/sidebar :: sidebar(${activePage})}"></aside>
    <div class="matrix26-content">
        <header th:replace="~{control_center/fragments/topbar :: topbar('Themes', 'Identidades visuales versionadas y reutilizables.')}"></header>
        <main class="matrix26-main">
            <div class="matrix26-alert-safe mb-4"><i class="bi bi-shield-check"></i><div><strong>Catálogo central sin acoplamiento operativo</strong><p>Los themes definen tokens visuales. No duplican plantillas y todavía no publican cambios en las instancias protegidas.</p></div></div>
            <section class="matrix26-theme-grid matrix26-theme-grid-large">
                <article class="matrix26-theme-card" th:each="usage : ${themes}">
                    <div class="theme-preview theme-preview-large" th:classappend="${usage.theme().code}">
                        <div class="theme-preview-sidebar"><i class="bi bi-grid-1x2-fill"></i><span></span><span></span><span></span><span></span></div>
                        <div class="theme-preview-workspace"><div class="theme-preview-topbar"></div><div class="theme-preview-hero"></div><div class="theme-preview-cards"><span></span><span></span><span></span></div><div class="theme-preview-table"></div></div>
                    </div>
                    <div class="matrix26-theme-card-body">
                        <div class="d-flex justify-content-between align-items-start gap-2"><div><span class="matrix26-catalog-type">Theme</span><h2 th:text="${usage.theme().name}">Theme</h2></div><span class="badge text-bg-success">Disponible</span></div>
                        <p th:text="${usage.theme().description}">Descripción</p>
                        <dl class="matrix26-catalog-meta"><div><dt>Código</dt><dd><code th:text="${usage.theme().code}">code</code></dd></div><div><dt>Versión</dt><dd th:text="${usage.theme().version}">1.0.0</dd></div><div><dt>Compatibilidad</dt><dd th:text="${usage.theme().supportsPublic and usage.theme().supportsAdmin ? 'Público + Admin' : (usage.theme().supportsPublic ? 'Público' : 'Admin')}">Compatibilidad</dd></div></dl>
                        <div class="matrix26-theme-usage"><span><strong th:text="${usage.publicUsage()}">0</strong> usos públicos</span><span><strong th:text="${usage.adminUsage()}">0</strong> usos admin</span></div>
                        <a class="btn btn-primary w-100" th:href="@{/control-center/themes/{code}(code=${usage.theme().code})}"><i class="bi bi-eye me-1"></i>Ver theme</a>
                    </div>
                </article>
            </section>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
