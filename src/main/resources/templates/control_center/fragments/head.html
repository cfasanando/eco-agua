<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title th:text="${pageTitle + ' - Matrix26 Control Center'}">Matrix26 Control Center</title>
    <script>
        (function () {
            try {
                var storedTheme = localStorage.getItem('matrix26-theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = storedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-matrix26-theme', theme);
                document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
            } catch (ignored) {
                document.documentElement.setAttribute('data-matrix26-theme', 'light');
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/appearance/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/themes/matrix26-classic.css}">
    <link rel="stylesheet" th:href="@{/css/themes/matrix26-nature.css}">
    <link rel="stylesheet" th:href="@{/css/themes/matrix26-warm.css}">
    <link rel="stylesheet" th:href="@{/css/layouts/admin-sidebar-classic.css}">
    <link rel="stylesheet" th:href="@{/css/layouts/admin-compact-workspace.css}">
    <link rel="stylesheet" th:href="@{/css/matrix26-control.css}">
    <link rel="stylesheet" th:href="@{/css/matrix26-ui-foundation.css}">
    <script defer th:src="@{/js/matrix26-theme.js}"></script>
</head>
</html>
