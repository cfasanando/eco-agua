<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<aside th:fragment="sidebar(activePage)" class="matrix26-sidebar">
    <a class="matrix26-brand" th:href="@{/control-center}">
        <img th:src="@{/img/matrix26-mark.svg}" alt="Matrix26">
        <span>
            <strong>Matrix26</strong>
            <small>Control Center</small>
        </span>
    </a>

    <div class="matrix26-sidebar-label">Control central</div>
    <nav class="matrix26-nav">
        <a th:href="@{/control-center}"
           th:classappend="${activePage == 'matrix26_dashboard'} ? ' active' : ''">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>
        <a th:href="@{/control-center/instances}"
           th:classappend="${activePage == 'matrix26_instances'} ? ' active' : ''">
            <i class="bi bi-hdd-stack"></i>
            <span>Instancias</span>
        </a>
        <a th:href="@{/control-center/provisioning}"
           th:classappend="${activePage == 'matrix26_provisioning'} ? ' active' : ''">
            <i class="bi bi-diagram-3"></i>
            <span>Aprovisionamiento</span>
        </a>
        <a th:href="@{/control-center/modules}"
           th:classappend="${activePage == 'matrix26_modules'} ? ' active' : ''">
            <i class="bi bi-grid-3x3-gap"></i>
            <span>Módulos</span>
        </a>
        <a th:href="@{/control-center/audit}"
           th:classappend="${activePage == 'matrix26_audit'} ? ' active' : ''">
            <i class="bi bi-clock-history"></i>
            <span>Auditoría</span>
        </a>
        <a th:href="@{/control-center/settings}"
           th:classappend="${activePage == 'matrix26_settings'} ? ' active' : ''">
            <i class="bi bi-sliders"></i>
            <span>Configuración</span>
        </a>
    </nav>

    <div class="matrix26-sidebar-note">
        <i class="bi bi-shield-check"></i>
        <div>
            <strong>Aislamiento activo</strong>
            <span>Matrix26 administra metadatos sin consultar datos operativos.</span>
        </div>
    </div>
</aside>
</html>
