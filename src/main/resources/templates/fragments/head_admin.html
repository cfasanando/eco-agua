<!-- templates/fragments/head_admin.html -->
<head th:fragment="adminHead(pageTitle)" xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Eco Agua</title>

    <!-- Bootstrap + icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

    <!-- DataTables Bootstrap 5 + Buttons (se puede usar o no en cada vista) -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/1.13.8/css/dataTables.bootstrap5.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css"/>

    <!-- Global admin styles -->
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>

    <th:block th:if="${appearanceManaged == true}">
        <link rel="stylesheet" th:href="@{/css/appearance/tokens.css}"/>
        <link rel="stylesheet" th:href="${appearanceAdminThemeCss}"/>
        <link rel="stylesheet" th:href="${appearanceAdminLayoutCss}"/>
        <link rel="stylesheet" th:href="@{/css/appearance/runtime.css}"/>
        <style th:utext="${appearanceCssVariables}"></style>
        <script th:inline="javascript">
            document.documentElement.dataset.theme = /*[[${appearanceAdminThemeCode}]]*/ 'matrix26-classic';
            document.documentElement.dataset.adminLayout = /*[[${appearanceAdminLayoutCode}]]*/ 'admin-sidebar-classic';
            document.documentElement.dataset.appearanceManaged = 'true';
        </script>
    </th:block>
</head>
