<head th:fragment="publicHead(pageTitle)"
      xmlns:th="http://www.thymeleaf.org">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title th:text="${seoTitle != null and !#strings.isEmpty(seoTitle) ? seoTitle : pageTitle}">Eco Agua</title>
    <meta name="description"
          th:content="${seoDescription != null and !#strings.isEmpty(seoDescription) ? seoDescription : platformTagline}" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical"
          th:if="${seoCanonicalUrl != null and !#strings.isEmpty(seoCanonicalUrl)}"
          th:href="${seoCanonicalUrl}" />

    <meta property="og:locale" content="es_PE" />
    <meta property="og:type"
          th:content="${seoOgType != null and !#strings.isEmpty(seoOgType) ? seoOgType : 'website'}" />
    <meta property="og:title"
          th:content="${seoTitle != null and !#strings.isEmpty(seoTitle) ? seoTitle : pageTitle}" />
    <meta property="og:description"
          th:content="${seoDescription != null and !#strings.isEmpty(seoDescription) ? seoDescription : platformTagline}" />
    <meta property="og:url"
          th:if="${seoCanonicalUrl != null and !#strings.isEmpty(seoCanonicalUrl)}"
          th:content="${seoCanonicalUrl}" />
    <meta property="og:image"
          th:if="${(appearanceSocialShareUrl != null and !#strings.isEmpty(appearanceSocialShareUrl)) or (seoOgImage != null and !#strings.isEmpty(seoOgImage))}"
          th:content="${appearanceSocialShareUrl != null and !#strings.isEmpty(appearanceSocialShareUrl) ? appearanceSocialShareUrl : seoOgImage}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title"
          th:content="${seoTitle != null and !#strings.isEmpty(seoTitle) ? seoTitle : pageTitle}" />
    <meta name="twitter:description"
          th:content="${seoDescription != null and !#strings.isEmpty(seoDescription) ? seoDescription : platformTagline}" />
    <meta name="twitter:image"
          th:if="${(appearanceSocialShareUrl != null and !#strings.isEmpty(appearanceSocialShareUrl)) or (seoOgImage != null and !#strings.isEmpty(seoOgImage))}"
          th:content="${appearanceSocialShareUrl != null and !#strings.isEmpty(appearanceSocialShareUrl) ? appearanceSocialShareUrl : seoOgImage}" />

    <link rel="icon"
          th:if="${appearanceFaviconUrl != null and !#strings.isEmpty(appearanceFaviconUrl)}"
          th:href="${appearanceFaviconUrl}" />

    <link rel="stylesheet"
          th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css}" />

    <link rel="stylesheet"
          th:href="@{https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css}" />

    <link rel="stylesheet" th:href="@{/css/admin.css}" />
    <link rel="stylesheet" th:href="@{/css/public.css}" />

    <th:block th:if="${appearanceManaged == true}">
        <link rel="stylesheet" th:href="@{/css/appearance/tokens.css}" />
        <link rel="stylesheet" th:href="${appearancePublicThemeCss}" />
        <link rel="stylesheet" th:href="${appearancePublicLayoutCss}" />
        <link rel="stylesheet" th:href="@{/css/appearance/runtime.css}" />
        <style th:utext="${appearanceCssVariables}"></style>
        <script th:inline="javascript">
            document.documentElement.dataset.theme = /*[[${appearancePublicThemeCode}]]*/ 'matrix26-classic';
            document.documentElement.dataset.publicLayout = /*[[${appearancePublicLayoutCode}]]*/ 'public-classic-grid';
            document.documentElement.dataset.appearanceManaged = 'true';
        </script>
    </th:block>
</head>
