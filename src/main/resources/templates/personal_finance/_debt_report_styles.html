<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="styles">
<style>
  @page {
    size: A4;
    margin: 12mm 10mm 15mm 10mm;
    @bottom-center {
      content: "Página " counter(page) " de " counter(pages);
      font-size: 8pt;
      color: #64748b;
    }
  }
  .pf-report { font-family: Arial, Helvetica, sans-serif; color: #172033; font-size: 10pt; line-height: 1.35; }
  .pf-report * { box-sizing: border-box; }
  .pf-report h1, .pf-report h2, .pf-report h3 { color: #0f2747; margin-top: 0; }
  .pf-report h1 { font-size: 24pt; margin-bottom: 8px; }
  .pf-report h2 { font-size: 15pt; border-bottom: 2px solid #2f75b5; padding-bottom: 5px; margin: 18px 0 9px; }
  .pf-report h3 { font-size: 11.5pt; margin-bottom: 5px; }
  .pf-report p { margin: 4px 0 8px; }
  .pf-report .muted { color: #64748b; }
  .pf-report .small { font-size: 8.5pt; }
  .pf-report .strong { font-weight: 700; }
  .pf-report .text-right { text-align: right; }
  .pf-report .text-center { text-align: center; }
  .pf-report .negative { color: #b42318; font-weight: 700; }
  .pf-report .positive { color: #067647; font-weight: 700; }
  .pf-report .cover {
    min-height: 245mm;
    padding: 24mm 12mm 12mm;
    border: 2px solid #163b67;
    background: #f7fbff;
    page-break-after: always;
  }
  .pf-report .cover-kicker { color: #2f75b5; font-size: 10pt; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
  .pf-report .cover-rule { width: 70px; height: 4px; background: #2f75b5; margin: 16px 0 22px; }
  .pf-report .cover-meta { margin-top: 28px; width: 100%; border-collapse: collapse; }
  .pf-report .cover-meta td { padding: 7px 8px; border-bottom: 1px solid #cbd5e1; }
  .pf-report .cover-meta td:first-child { width: 38%; color: #475569; font-weight: 700; }
  .pf-report .confidential {
    margin-top: 30px;
    padding: 10px 12px;
    background: #fff7ed;
    border: 1px solid #fdba74;
    color: #9a3412;
    font-size: 9pt;
  }
  .pf-report .summary-grid { width: 100%; border-collapse: separate; border-spacing: 6px; margin: 0 -6px 10px; }
  .pf-report .summary-grid td { width: 25%; vertical-align: top; background: #eef5fc; border: 1px solid #b8d3ec; padding: 9px; }
  .pf-report .summary-label { display: block; color: #52677f; font-size: 8pt; text-transform: uppercase; }
  .pf-report .summary-value { display: block; font-size: 14pt; font-weight: 700; margin-top: 3px; color: #0f2747; }
  .pf-report .notice { padding: 8px 10px; margin: 8px 0 12px; border-left: 4px solid #2f75b5; background: #eff6ff; }
  .pf-report .warning { border-left-color: #d97706; background: #fff7ed; }
  .pf-report table.data { width: 100%; border-collapse: collapse; margin: 6px 0 12px; table-layout: fixed; }
  .pf-report table.data thead { display: table-header-group; }
  .pf-report table.data tr { page-break-inside: avoid; }
  .pf-report table.data th { background: #163b67; color: #fff; font-size: 8pt; padding: 6px 5px; border: 1px solid #163b67; text-align: left; }
  .pf-report table.data td { padding: 5px; border: 1px solid #cbd5e1; vertical-align: top; font-size: 8.4pt; word-wrap: break-word; }
  .pf-report table.data tbody tr:nth-child(even) { background: #f8fafc; }
  .pf-report .badge { display: inline-block; padding: 2px 5px; border-radius: 3px; background: #e2e8f0; color: #334155; font-size: 7.5pt; font-weight: 700; }
  .pf-report .badge-danger { background: #fee2e2; color: #991b1b; }
  .pf-report .badge-warning { background: #fef3c7; color: #92400e; }
  .pf-report .badge-success { background: #dcfce7; color: #166534; }
  .pf-report .debt-card { border: 1px solid #b8c5d6; margin: 10px 0 14px; page-break-inside: avoid; }
  .pf-report .debt-card-header { background: #eaf2fb; padding: 8px 10px; border-bottom: 1px solid #b8c5d6; }
  .pf-report .debt-card-body { padding: 8px 10px; }
  .pf-report .detail-grid { width: 100%; border-collapse: collapse; }
  .pf-report .detail-grid td { width: 25%; padding: 4px 7px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
  .pf-report .detail-grid .label { color: #64748b; font-size: 7.5pt; text-transform: uppercase; display: block; }
  .pf-report .detail-grid .value { font-weight: 700; display: block; margin-top: 2px; }
  .pf-report .schedule-block { page-break-before: auto; }
  .pf-report .page-break { page-break-before: always; }
  .pf-report .footer-note { margin-top: 16px; padding-top: 8px; border-top: 1px solid #cbd5e1; color: #64748b; font-size: 8pt; }
  .pf-report .screen-toolbar { margin-bottom: 14px; }
  @media print {
    .pf-report .screen-only { display: none !important; }
    .pf-report { font-size: 9pt; }
  }
</style>
</th:block>
