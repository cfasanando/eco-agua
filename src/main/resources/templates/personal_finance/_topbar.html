<header class="topbar pf-topbar pf-desktop-topbar d-flex align-items-center justify-content-between"
        xmlns:th="http://www.thymeleaf.org"
        th:fragment="topbar">
  <div class="pf-topbar-context pf-desktop-chrome-title">
    <div class="pf-window-caption">
      <span class="pf-window-dot is-red"></span>
      <span class="pf-window-dot is-yellow"></span>
      <span class="pf-window-dot is-green"></span>
      <strong>GastoClaro Personal</strong>
      <span class="pf-window-separator">/</span>
      <span>Matrix26 Desktop</span>
    </div>
    <div class="topbar-date pf-topbar-date">
      <span id="currentDate">Hoy</span>
      &nbsp;|&nbsp;
      <span id="currentTime">00:00:00</span>
    </div>
  </div>

  <div class="pf-desktop-commandbar d-flex align-items-center gap-2">
    <a th:href="@{/gasto-claro/monthly-plan}" class="btn btn-sm btn-primary pf-topbar-action">
      <i class="bi bi-calendar2-week"></i> Plan mensual
    </a>
    <a th:href="@{/gasto-claro/dashboard}" class="btn btn-sm btn-outline-primary pf-topbar-action d-none d-md-inline-flex">
      <i class="bi bi-speedometer2"></i> Panel
    </a>
    <a th:href="@{/home}" class="btn btn-sm btn-outline-secondary pf-topbar-action d-none d-lg-inline-flex">
      <i class="bi bi-grid"></i> Eco Agua
    </a>

    <div class="topbar-user dropdown">
      <button class="topbar-user-button pf-desktop-user-button" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="topbar-user-name" th:text="${#authentication.name}">Usuario</span>
        <span class="topbar-avatar" th:text="${#authentication.name != null ? #authentication.name.substring(0,1).toUpperCase() : 'U'}">U</span>
        <i class="bi bi-chevron-down small text-muted"></i>
      </button>

      <div class="dropdown-menu dropdown-menu-end shadow border-0 topbar-personal-menu pf-user-menu pf-desktop-user-menu">
        <div class="px-3 py-2 border-bottom pf-menu-session">
          <div class="small text-muted">Sesión actual</div>
          <div class="fw-semibold" th:text="${#authentication.name}">Usuario</div>
        </div>
        <a class="dropdown-item" th:href="@{/gasto-claro/dashboard}">
          <i class="bi bi-wallet2 me-2"></i> GastoClaro Personal
        </a>
        <a class="dropdown-item" th:href="@{/gasto-claro/monthly-plan}">
          <i class="bi bi-calendar2-week me-2"></i> Plan mensual
        </a>
        <a class="dropdown-item" th:href="@{/gasto-claro/debts}">
          <i class="bi bi-credit-card me-2"></i> Mis deudas
        </a>
        <a class="dropdown-item" th:href="@{/home}">
          <i class="bi bi-grid me-2"></i> Panel general Eco Agua
        </a>
        <div class="dropdown-divider"></div>
        <form th:action="@{/logout}" method="post" class="m-0">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="dropdown-item text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
          </button>
        </form>
      </div>
    </div>
  </div>
</header>
