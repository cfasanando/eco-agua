<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head_admin :: adminHead('GastoClaro - Gastos fijos')"></head>
<body>
<div class="app-layout" th:with="activePage='gasto_claro_fixed_expenses'">
  <aside th:replace="fragments/sidebar :: sidebar"></aside>
  <div class="main-content">
    <header th:replace="fragments/topbar :: topbar"></header>
    <main class="content-wrapper">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
        <div><h1 class="h4 mb-1">Gastos fijos</h1><p class="text-muted mb-0">Pagos recurrentes personales y del hogar.</p></div>
        <a th:href="@{/gasto-claro/dashboard}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Dashboard</a>
      </div>
      <div th:replace="personal_finance/_nav :: nav('fixed_expenses')"></div>
      <div th:if="${message}" class="alert" th:classappend="${messageType == 'success'} ? ' alert-success' : ' alert-danger'" th:text="${message}">Mensaje</div>

      <div class="row g-3">
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white fw-semibold" th:text="${expenseForm.id == null ? 'Nuevo gasto fijo' : 'Editar gasto fijo'}">Nuevo gasto fijo</div>
            <div class="card-body">
              <form th:action="@{/gasto-claro/fixed-expenses}" th:object="${expenseForm}" method="post" class="row g-3">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" th:field="*{id}"/>
                <div class="col-12"><label class="form-label">Nombre</label><input class="form-control" th:field="*{name}" placeholder="Alquiler, internet, UTP..." required></div>
                <div class="col-md-6"><label class="form-label">Categoría</label><select class="form-select" th:field="*{category}"><option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.label}">Cat</option></select></div>
                <div class="col-md-6"><label class="form-label">Moneda</label><select class="form-select" th:field="*{currency}"><option th:each="currency : ${currencies}" th:value="${currency}" th:text="${currency}">PEN</option></select></div>
                <div class="col-md-6"><label class="form-label">Monto</label><input type="number" step="0.01" class="form-control" th:field="*{amount}"></div>
                <div class="col-md-6"><label class="form-label">Día pago</label><input type="number" min="1" max="31" class="form-control" th:field="*{dueDay}"></div>
                <div class="col-md-6"><label class="form-label">Frecuencia</label><select class="form-select" th:field="*{frequency}"><option th:each="frequency : ${frequencies}" th:value="${frequency}" th:text="${frequency.label}">Mensual</option></select></div>
                <div class="col-md-6 d-flex align-items-end"><div class="d-flex flex-column gap-1">
                  <label class="form-check"><input type="hidden" name="mandatory" value="false"><input class="form-check-input" type="checkbox" th:field="*{mandatory}"> Obligatorio</label>
                  <label class="form-check"><input type="hidden" name="active" value="false"><input class="form-check-input" type="checkbox" th:field="*{active}"> Activo</label>
                </div></div>
                <div class="col-12"><label class="form-label">Notas</label><textarea class="form-control" rows="2" th:field="*{notes}"></textarea></div>
                <div class="col-12 d-grid gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Guardar</button><a th:if="${expenseForm.id != null}" th:href="@{/gasto-claro/fixed-expenses}" class="btn btn-outline-secondary">Cancelar edición</a></div>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm">
            <div class="card-header bg-white fw-semibold">Mis gastos fijos</div>
            <div class="card-body p-0"><div class="table-responsive"><table class="table table-hover align-middle mb-0">
              <thead class="table-light"><tr><th>Gasto</th><th>Vence</th><th>Frecuencia</th><th>Estado</th><th class="text-end">Monto</th><th></th></tr></thead>
              <tbody>
              <tr th:each="expense : ${expenses}">
                <td><div class="fw-semibold" th:text="${expense.name}">Gasto</div><small class="text-muted" th:text="${expense.category.label}">Categoría</small></td>
                <td th:text="${expense.dueDay != null ? 'Día ' + expense.dueDay : '-'}">Día 1</td>
                <td th:text="${expense.frequency.label}">Mensual</td>
                <td><span class="badge" th:classappend="${expense.active} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${expense.active ? 'Activo' : 'Inactivo'}">Activo</span></td>
                <td class="text-end"><span th:text="${expense.currency}">PEN</span> <span th:text="${#numbers.formatDecimal(expense.amount,1,'POINT',2,'POINT')}">0.00</span></td>
                <td class="text-end"><a th:href="@{/gasto-claro/fixed-expenses(editId=${expense.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                  <form th:action="@{/gasto-claro/fixed-expenses/{id}/delete(id=${expense.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Eliminar este gasto fijo?')"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/><button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i></button></form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(expenses)}"><td colspan="6" class="text-center text-muted py-4">Aún no hay gastos fijos registrados.</td></tr>
              </tbody>
            </table></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<div th:replace="fragments/scripts_admin :: scripts"></div>
</body>
</html>
